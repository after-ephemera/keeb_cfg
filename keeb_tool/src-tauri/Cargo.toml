[package]
name = "keeb-config-tool"
version = "0.1.0"
description = "Visual editor for a KMK Lily58 keymap with 3D view and CircuitPython flashing"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keeb_core = { path = "../core" }

[features]
# Tauri custom protocol used in production builds.
custom-protocol = ["tauri/custom-protocol"]
